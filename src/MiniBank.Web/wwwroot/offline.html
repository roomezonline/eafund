<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>آفلاین هستید - صندوق امام علی (ع)</title>
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    body { display:flex; min-height:100vh; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); }
    .card { max-width:560px; padding:32px; border-radius:16px; background:var(--card-bg); box-shadow:0 10px 30px rgba(0,0,0,.25); text-align:center; }
    h1 { margin:0 0 8px; font-size:1.6rem }
    p { opacity:.9; }
    .tips { margin-top:16px; font-size:.9rem; opacity:.8 }
    :root[data-theme="dark"] { --bg:#0b1324; --fg:#e5e7eb; --card-bg:#0f172a; }
    :root[data-theme="light"] { --bg:#f8fafc; --fg:#0f172a; --card-bg:#ffffff; }
  </style>
</head>
<body>
  <main class="card">
    <h1>اتصال اینترنت قطع است</h1>
    <p>شما در حال حاضر آفلاین هستید. برخی بخش‌های برنامه ممکن است بدون اتصال کار نکنند.</p>
    <div class="tips">
      لطفاً اتصال خود را بررسی کرده و دوباره تلاش کنید. محتوای ایستا در صورت امکان از کش نمایش داده می‌شود.
    </div>
  </main>
</body>
</html>
