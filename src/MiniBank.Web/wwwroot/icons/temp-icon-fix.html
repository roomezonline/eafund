<!DOCTYPE html>
<html>
<head>
    <title>Temporary Icon Fix</title>
</head>
<body>
    <script>
        // Create a simple 192x192 icon and convert to blob
        function createTempIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');

            // Purple gradient background
            const gradient = ctx.createLinearGradient(0, 0, 192, 192);
            gradient.addColorStop(0, '#6750a4');
            gradient.addColorStop(1, '#4f378b');
            ctx.fillStyle = gradient;
            
            // Rounded rectangle
            ctx.beginPath();
            ctx.roundRect(0, 0, 192, 192, 28);
            ctx.fill();

            // White vault icon
            ctx.strokeStyle = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 6;

            // Main circle
            ctx.beginPath();
            ctx.arc(96, 96, 50, 0, 2 * Math.PI);
            ctx.stroke();

            // Inner circle
            ctx.beginPath();
            ctx.arc(96, 96, 30, 0, 2 * Math.PI);
            ctx.stroke();

            // Center dot
            ctx.beginPath();
            ctx.arc(96, 96, 4, 0, 2 * Math.PI);
            ctx.fill();

            // Handle
            ctx.beginPath();
            ctx.arc(126, 96, 8, 0, 2 * Math.PI);
            ctx.fill();

            return canvas.toDataURL('image/png');
        }

        // Generate and download the icon
        const iconData = createTempIcon();
        const link = document.createElement('a');
        link.download = 'icon-192.png';
        link.href = iconData;
        document.body.appendChild(link);
        link.click();
        
        // Show the generated icon
        const img = document.createElement('img');
        img.src = iconData;
        img.style.border = '1px solid #ccc';
        document.body.appendChild(img);
        
        document.body.innerHTML += '<p>Icon generated and downloaded. Replace the empty icon-192.png file with this one, then resize for other sizes.</p>';
    </script>
</body>
</html>
